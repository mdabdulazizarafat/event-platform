version: '3.8'

services:
  # Isolated PostgreSQL Database
  ayojok-postgres:
    image: postgres:15-alpine
    container_name: ayojok-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-ayojok_db}
      POSTGRES_USER: ${DB_USER:-ayojok_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-db_d579e08879c368fa3c4f71ab67788df6}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No port published to host for maximum database security
    networks:
      - ayojok-network

  # Isolated Redis Cache and Worker Queue
  ayojok-redis:
    image: redis:7-alpine
    container_name: ayojok-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_a84e6713b656f5088871d9c28f17a8c9}
    volumes:
      - redis_data:/data
    # No port published to host for security
    networks:
      - ayojok-network

  # Express Backend API
  ayojok-backend:
    image: ghcr.io/mdabdulazizarafat/ayojok-backend:latest
    container_name: ayojok-backend
    restart: always
    depends_on:
      - ayojok-postgres
      - ayojok-redis
    ports:
      # Bound to 127.0.0.1 to prevent public internet access to this port
      - "127.0.0.1:8081:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${DB_USER:-ayojok_user}:${DB_PASSWORD:-db_d579e08879c368fa3c4f71ab67788df6}@ayojok-postgres:5432/${DB_NAME:-ayojok_db}?sslmode=disable
      - REDIS_HOST=ayojok-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_a84e6713b656f5088871d9c28f17a8c9}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-https://ayojok.rongplan.com}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://ayojok.rongplan.com}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      - SSLCOMMERZ_STORE_ID=${SSLCOMMERZ_STORE_ID}
      - SSLCOMMERZ_STORE_PASSWORD=${SSLCOMMERZ_STORE_PASSWORD}
      - SSLCOMMERZ_IS_LIVE=${SSLCOMMERZ_IS_LIVE:-false}
    networks:
      - ayojok-network

  # Next.js Frontend
  ayojok-frontend:
    image: ghcr.io/mdabdulazizarafat/ayojok-frontend:latest
    container_name: ayojok-frontend
    restart: always
    ports:
      # Bound to 127.0.0.1 to prevent public internet access to this port
      - "127.0.0.1:8080:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://ayojok.rongplan.com}
    networks:
      - ayojok-network

networks:
  ayojok-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
