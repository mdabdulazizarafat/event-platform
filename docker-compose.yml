services:
  # Isolated PostgreSQL Database
  Somavesh-postgres:
    image: postgres:15-alpine
    container_name: Somavesh-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-Somavesh_db}
      POSTGRES_USER: ${DB_USER:-Somavesh_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-Somavesh_user} -d ${DB_NAME:-Somavesh_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - Somavesh-network

  # Isolated Redis Cache and Worker Queue
  Somavesh-redis:
    image: redis:7-alpine
    container_name: Somavesh-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-secret}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - Somavesh-network

  # Express Backend API
  Somavesh-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ghcr.io/mdabdulazizarafat/somavesh-backend:main
    container_name: Somavesh-backend
    restart: always
    depends_on:
      Somavesh-postgres:
        condition: service_healthy
      Somavesh-redis:
        condition: service_healthy
    ports:
      # Bound to 127.0.0.1 to prevent public internet access to this port
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${DB_USER:-Somavesh_user}:${DB_PASSWORD:-secret}@Somavesh-postgres:5432/${DB_NAME:-Somavesh_db}?sslmode=disable
      - REDIS_HOST=Somavesh-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-secret}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-https://Somavesh.com}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://Somavesh.com}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      - SSLCOMMERZ_STORE_ID=${SSLCOMMERZ_STORE_ID}
      - SSLCOMMERZ_STORE_PASSWORD=${SSLCOMMERZ_STORE_PASSWORD}
      - SSLCOMMERZ_IS_LIVE=${SSLCOMMERZ_IS_LIVE:-false}
    networks:
      - Somavesh-network

  # Next.js Frontend
  Somavesh-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ghcr.io/mdabdulazizarafat/somavesh-frontend:main
    container_name: Somavesh-frontend
    restart: always
    ports:
      # Bound to 127.0.0.1 to prevent public internet access to this port
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://somavesh.com}
    networks:
      - Somavesh-network

networks:
  Somavesh-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
