# =========================================================================
# Nginx Configuration for Ayojok Event Platform
# Domain: ayojok.rongplan.com
# Managed via Cloudflare DNS & SSL proxying (Flexible / Full / Full Strict)
# =========================================================================

# Rate limit zone definition for API protection (10 requests per second burst)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name ayojok.rongplan.com;
    
    # Allow larger body sizes for image uploads
    client_max_body_size 10M;

    # Redirect all HTTP traffic to HTTPS (Optional: Cloudflare usually does this,
    # but having it at the origin level is best practice)
    # If using Cloudflare "Flexible" SSL, keep this commented out to avoid redirect loops.
    # return 301 https://$host$request_uri;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_proxied any;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline';" always;

    # Access and Error Logs
    access_log /var/log/nginx/ayojok_access.log;
    error_log /var/log/nginx/ayojok_error.log warn;

    # 1. API Route Proxy (Requests to /api/v1/)
    location /api/v1/ {
        limit_req zone=api_limit burst=15 nodelay;

        proxy_pass http://127.0.0.1:3001/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Cloudflare IP forwarding headers
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Next.js Frontend Proxy (All other requests)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS Server Block (For Cloudflare SSL Mode: "Full" or "Full Strict")
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ayojok.rongplan.com;
    
    # Allow larger body sizes for image uploads
    client_max_body_size 10M;

    ssl_certificate /etc/ssl/certs/ayojok.rongplan.com.pem;
    ssl_certificate_key /etc/ssl/private/ayojok.rongplan.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline';" always;

    # Access and Error Logs
    access_log /var/log/nginx/ayojok_ssl_access.log;
    error_log /var/log/nginx/ayojok_ssl_error.log warn;

    # API Proxy
    location /api/v1/ {
        limit_req zone=api_limit burst=15 nodelay;
        proxy_pass http://127.0.0.1:3001/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Proxy
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
